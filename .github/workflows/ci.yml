name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: .NET 10 / xUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Edonism.slnx
      - name: Build
        run: dotnet build Edonism.slnx -c Release --no-restore
      - name: xUnit
        run: dotnet test Edonism.slnx -c Release --no-build

  frontend:
    name: React / Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Typecheck and bundle
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            src/frontend/test-results/
            src/frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
